<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentify - Secure Access</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f6f8fd 0%, #f1f5f9 100%); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.08); padding: 3rem; width: 100%; max-width: 460px; }
        .form-control { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 0.875rem 1.25rem; }
        .form-control:focus { background: #fff; border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        .btn-brand { background: #0f172a; color: #fff; border-radius: 12px; padding: 0.875rem; font-weight: 600; transition: all 0.2s; }
        .btn-brand:hover { background: #4f46e5; color: #fff; }
        .nav-pills .nav-link { color: #64748b; font-weight: 600; border-radius: 10px; }
        .nav-pills .nav-link.active { background: #0f172a; color: #fff; }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="glass-card position-relative overflow-hidden">
        
        <div class="text-center mb-4">
            <a href="/" class="text-decoration-none text-dark display-6 fw-bold">
                <i class="bi bi-box-seam-fill text-primary"></i> Rentify
            </a>
        </div>

        <!-- AUTH TABS -->
        <ul class="nav nav-pills nav-fill mb-4 bg-light p-1 rounded-4" id="authTabs">
            <li class="nav-item"><button class="nav-link active py-2" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button">Sign In</button></li>
            <li class="nav-item"><button class="nav-link py-2" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button">Register</button></li>
        </ul>

        <div class="tab-content">
            <!-- SIGN IN FORM -->
            <div class="tab-pane fade show active" id="login-pane">
                <form id="form-login">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Email Address</label>
                        <input type="email" id="login-email" class="form-control" placeholder="name@company.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted">Password</label>
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="text-end mb-3">
                        <button type="button" class="btn btn-link btn-sm text-decoration-none p-0" onclick="document.getElementById('login-pane').classList.add('d-none'); document.getElementById('forgot-container').classList.remove('d-none')">Forgot password?</button>
                    </div>
                    <button type="submit" class="btn btn-brand w-100 mb-3">Secure Sign In</button>
                </form>
            </div>
	    <div id="forgot-container" class="d-none">
    		<h5 class="fw-bold mb-2">Reset Password</h5>
    		<p id="forgot-message" class="text-muted small mb-4">Enter your email to receive a secure recovery code.</p>
		 <form id="form-forgot-request">
		        <input type="email" id="forgot-email" class="form-control mb-4" placeholder="name@example.com" required>
			 <button type="submit" class="btn btn-primary w-100 mb-2">Send Recovery Code</button>
			<button type="button" class="btn btn-light w-100 fw-bold" onclick="document.getElementById('forgot-container').classList.add('d-none'); document.getElementById('login-pane').classList.remove('d-none');">Back to Login</button>
		 </form>
        <form id="form-reset-password" class="d-none">
            <label for="reset-otp-code" class="form-label fw-bold small text-muted">6-digit recovery code</label>
            <input type="text" id="reset-otp-code" class="form-control mb-3" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
            <label for="reset-new-password" class="form-label fw-bold small text-muted">New password</label>
            <input type="password" id="reset-new-password" class="form-control mb-3" minlength="6" required>
            <button type="submit" class="btn btn-brand w-100 mb-2">Reset password</button>
            <button type="button" class="btn btn-light w-100 fw-bold" onclick="returnToAuth()">Back to Sign In</button>
        </form>
	   </div>

            <!-- SIGN UP FORM -->
            <div class="tab-pane fade" id="register-pane">
                <form id="form-register">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Full Name</label>
                        <input type="text" id="reg-name" class="form-control" placeholder="Haider Mustafa" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Email Address</label>
                        <input type="email" id="reg-email" class="form-control" placeholder="name@company.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Password</label>
                        <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required>
                    </div>
                    <button type="submit" class="btn btn-brand w-100">Create Account</button>
                </form>
            </div>
            <div id="otp-container" class="d-none">
                <h5 class="fw-bold mb-2">Verify your account</h5>
                <p id="otp-message" class="text-muted small mb-4">Enter the code sent to your email.</p>
                <form id="form-otp">
                    <label for="otp-code" class="form-label fw-bold small text-muted">6-digit verification code</label>
                    <input type="text" id="otp-code" class="form-control mb-3" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
                    <button type="submit" class="btn btn-brand w-100 mb-2">Verify and continue</button>
                    <button type="button" class="btn btn-light w-100 fw-bold" onclick="returnToAuth()">Back</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js?v=115"></script>
</body>
</html>
