<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentify - Item Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css?v=43">
</head>
<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg sticky-top bg-white">
  <div class="container">
    <a class="navbar-brand fs-3 fw-bold text-primary" href="/"><i class="bi bi-box-seam-fill me-2"></i>Rentify</a>
    <div class="d-flex align-items-center gap-3">
        
        <!-- Logged-In View -->
        <div id="user-profile-group" class="d-none d-flex align-items-center gap-3">
            
            <div class="dropdown">
              <button class="btn btn-primary dropdown-toggle fw-bold px-3 py-2" type="button" data-bs-toggle="dropdown">
                <i class="bi bi-person-circle me-1"></i> <span id="nav-user-name">Account</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-4 mt-2 p-2">
                <li><a class="dropdown-item py-2 fw-bold rounded-3" href="/profile"><i class="bi bi-person me-2 text-primary"></i> Account</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><button class="dropdown-item py-2 text-danger fw-bold rounded-3" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i> Logout</button></li>
              </ul>
            </div>
        </div>
        
        <!-- Logged-Out View -->
        <div id="auth-btn-group" class="d-flex gap-2">
            <a href="/login" class="btn btn-outline-primary fw-bold px-4 rounded-pill">Sign In</a>
            <a href="/login" class="btn btn-primary fw-bold px-4 rounded-pill">Sign Up</a>
        </div>
    </div>
  </div>
</nav>

<div class="container my-5">
    <a href="/" class="btn btn-link text-decoration-none text-muted mb-4 p-0 fw-semibold">
        <i class="bi bi-arrow-left me-1"></i> Back to Marketplace
    </a>

    <div class="row g-5">
        <!-- Item Image -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
                <img id="item-image" src="/static/images/default.jpg" class="img-fluid w-100" style="max-height: 450px; object-fit: cover;" alt="Item Image" onerror="this.src='/static/images/default.jpg'">
            </div>
        </div>

        <!-- Item Details & Booking Panel -->
        <div class="col-lg-6">
            <span id="item-category" class="category-badge-chip mb-2 d-inline-block">Category</span>
            <h2 id="item-title" class="fw-bold text-dark mb-3">Loading item...</h2>
            <p id="item-desc" class="text-muted lead mb-4 fs-6" style="line-height: 1.8;">Loading description...</p>

            <div class="p-4 bg-white rounded-4 border shadow-sm mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <span class="text-muted small fw-semibold">Daily Rental Rate</span>
                        <h3 id="item-price" class="fw-bold text-primary mb-0">Rs. 0</h3>
                    </div>
                    <div class="text-end">
                        <span class="text-muted small fw-semibold">Security Deposit</span>
                        <h5 id="item-deposit" class="fw-bold text-dark mb-0">Rs. 0</h5>
                    </div>
                </div>
                <div class="d-flex align-items-center text-muted small">
                    <i class="bi bi-geo-alt-fill text-danger me-1"></i> <span id="item-location">Karachi</span>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <p class="small text-muted mb-0"><i class="bi bi-info-circle me-2"></i>Booking and payment workflows are planned for FYP-II.</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js?v=115"></script>
</body>
</html>
